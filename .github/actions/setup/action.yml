name: Set up the project
description: >-
  Node 24, pnpm (the version package.json's packageManager names) and a frozen install. The explorer depends on no private
  package, so it needs no npm token. The postinstall hook runs `wrangler types`.

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6

    # package.json asks for Node >= 24.
    - uses: actions/setup-node@v7
      with:
        node-version: 24.22.1
        cache: pnpm

    - name: Install
      shell: bash
      run: pnpm install --frozen-lockfile
