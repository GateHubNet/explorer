# Build and test on every pull request to master and every push to master. The release workflow runs it as its first job.
# The pipeline is README "The pipeline and deploying": `pnpm verify` (api:check, typecheck, the unit, component and workerd
# tests, the build, the page-size budgets), `pnpm fixtures:check`, and the end-to-end suite on the built Worker.

name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A newer push to a pull request replaces its run; master and tags run to the end.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Verify (typecheck, tests, build, page sizes)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm verify
      - run: pnpm fixtures:check

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Chromium for Playwright
        run: pnpm exec playwright install --with-deps chromium
      # Builds the Worker itself and runs it under `wrangler dev` against the fixture server (test/e2e/stack.ts).
      - run: pnpm test:e2e
      - name: Keep the report of a failed run
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore

  changelog:
    name: Changelog preview
    # The release writes its own; on a tag this would only repeat it.
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --unreleased --strip header
        env:
          OUTPUT: CHANGELOG-unreleased.md
      - name: Show it in the job summary
        run: |
          {
            echo "What the next release's changelog holds so far:"
            echo
            cat CHANGELOG-unreleased.md
          } >> "$GITHUB_STEP_SUMMARY"
