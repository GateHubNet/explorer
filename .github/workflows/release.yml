# A release, on every pushed version tag (v1.4.0, or a pre-release such as v1.4.0-rc.1). The explorer runs on Cloudflare
# Workers, so a release is a deploy there and a GitHub release, not an image:
#   1. version  the tag must be a semantic version (vMAJOR.MINOR.PATCH, an optional -pre-release); anything else stops here;
#   2. test     the whole CI workflow (verify, fixtures:check, the end-to-end suite);
#   3. deploy   `pnpm deploy:production` to Cloudflare, only while the repository variable CLOUDFLARE_DEPLOY is "true": the
#               pre-deploy guard passes, production's hosts and route being set (README "Hosts and routes"), once the secrets
#               are set; the deploy stays behind CLOUDFLARE_DEPLOY, and only production is deployed from here (the sandbox is
#               deployed by hand, `pnpm deploy:sandbox`);
#   4. release  the GitHub release of the tag: its body is the changelog since the previous tag (cliff.toml), which is also
#               attached as CHANGELOG.md. A tag with a "-" is marked a pre-release.
# A release exists only for a tag that is a version, whose tests passed and, when the deploy is on, that is deployed.

name: Release

on:
  push:
    # Version-shaped tags only (filter patterns, not regular expressions: + is one or more, . is a dot); the version job checks
    # the rest.
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # A semantic version as a tag: v, then MAJOR.MINOR.PATCH without leading zeros, then an optional pre-release of dot-separated
  # identifiers, a numeric one without leading zeros (rc.1, not rc.01). No build metadata (+...): the release tags are plain versions.
  SEMVER_TAG: '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*)?$'

jobs:
  version:
    name: Version of the tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ $SEMVER_TAG ]]; then
            echo "::error::$TAG is not a version tag (v1.4.0, or v1.4.0-rc.1): nothing is deployed or released."
            exit 1
          fi

  test:
    needs: version
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy to Cloudflare (production)
    needs: test
    if: ${{ vars.CLOUDFLARE_DEPLOY == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Protection rules (a required reviewer, which tags may deploy) go on this environment in the repository's settings.
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # Build for production, the pre-deploy guard, `wrangler deploy` (README "The pipeline and deploying").
      - name: pnpm deploy:production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          export BUILD_ID="${GITHUB_SHA::7}"
          pnpm deploy:production

  release:
    name: GitHub release
    # After the tests, and after the deploy when it is on: a deploy that is off (skipped) does not hold the release, one that ran
    # must have passed.
    needs: [test, deploy]
    if: ${{ !cancelled() && needs.test.result == 'success' && (needs.deploy.result == 'success' || needs.deploy.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Changelog since the previous tag
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --current --strip header
        env:
          OUTPUT: CHANGELOG.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=""
          case "$TAG" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$TAG" CHANGELOG.md --verify-tag --title "$TAG" --notes-file CHANGELOG.md $prerelease
